worker:
  pollingSeconds: 60
  preflightTimeoutSeconds: 60
  maxParallelTasks: 1

projects:
  directory: ./projects

telegram:
  enabled: false

api:
  enabled: true
  listenUrl: http://127.0.0.1:5080
  eventHistoryLimit: 500

# Optional managed registration. Set CODEX_SERVER_REGISTRATION_TOKEN in the worker environment.

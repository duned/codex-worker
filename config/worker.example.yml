worker:
  pollingSeconds: 60
  preflightTimeoutSeconds: 60
  maxParallelTasks: 1
  # Server provisioning is disabled unless explicitly enabled here.
  provisioning:
    enabled: false
    allowNonPrivileged: false
    allowCredentials: false
    # Keys use type:name:operation, for example tool:git:install.
    allowedPrivilegedActions: []
    deniedActions: []

projects:
  directory: ./projects
  # standalone polls configured GitHub queues; managed requests Server assignments for configured projects.
  # In either mode the Worker owns GitHub labels, comments, and Issue closure.
  ownership: standalone

telegram:
  enabled: false

api:
  enabled: true
  listenUrl: http://127.0.0.1:5080
  eventHistoryLimit: 500

# Optional managed registration. Set CODEX_SERVER_REGISTRATION_TOKEN in the worker environment.
# The Server registry API and dashboard use the separate CODEX_SERVER_MANAGEMENT_TOKEN.
# server:
#   enabled: true
#   url: http://127.0.0.1:5090
#   heartbeatIntervalSeconds: 20
#   identityFile: ~/.codex-worker/worker-id
# For managed project ownership, set projects.ownership: managed.

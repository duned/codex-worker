worker:
  pollingSeconds: 60
  preflightTimeoutSeconds: 60
  maxParallelTasks: 1
  # Server provisioning is disabled unless explicitly enabled here.
  provisioning:
    enabled: false
    allowNonPrivileged: false
    allowCredentials: false
    # Keys use type:name:operation, for example tool:git:install.
    # Add worker:self-update to permit dashboard updates on a packaged Linux node.
    # Add worker:restart to permit controlled dashboard restarts.
    allowedPrivilegedActions: []
    deniedActions: []

projects:
  directory: ./projects
  # standalone uses project YAML as the project source of truth. Managed mode applies
  # versioned Server project definitions without reading local project YAML.
  # Runtime defaults for managed projects are configured once below.
  # In either mode the Worker owns GitHub labels, comments, and Issue closure.
  ownership: standalone

# Worker-local runtime defaults used only in managed ownership. Checkout paths are
# derived from Server project IDs beneath this root; missing checkouts are cloned on assignment.
managedProjects:
  checkoutDirectory: ~/.codex-worker/checkouts
  # Same git/github/codex/validation/environment/worker sections as project YAML,
  # without project identity. git.baseBranch is always supplied by the Server.
  # Relative codex.instructionsFile paths resolve inside each derived checkout.
  # The default AGENTS.md is optional in managed mode; other configured paths are required.
  codex:
    instructionsFile: AGENTS.md
  validation:
    commands: []
  worker:
    maxParallelTasks: 1

telegram:
  enabled: false

api:
  enabled: true
  listenUrl: http://127.0.0.1:5080
  eventHistoryLimit: 500

# Passive standalone reporting is off until dashboard pairing + 'codex-worker reporting connect'.
# Keep projects.ownership: standalone; do not enable server.enabled for observer reporting.
# Use an exact HTTPS origin and enter the five-minute one-use authorization at the hidden prompt.
# See docs/operations.md#optional-standalone-reporting for setup/status/disconnect/revocation.
# This file contains no observer credential; connect manages a protected node-local file.
# Connect applies on the next interval; disconnect waits for in-flight delivery and stops reports.
# Neither requires a restart. Changing these YAML settings requires a restart.
reporting:
  # Separate local opt-in; Server must also grant the exact project/repository binding.
  allowBranchMaintenance: false
  intervalSeconds: 30
  credentialFile: ~/.codex-worker/observer.json

# Optional managed registration. Enroll using codex-worker register; normal requests require the durable per-Worker credential.
# The Server registry API and dashboard use the separate CODEX_SERVER_MANAGEMENT_TOKEN.
# server:
#   enabled: true
#   url: http://127.0.0.1:5090
#   heartbeatIntervalSeconds: 20
#   identityFile: ~/.codex-worker/worker-id
# For managed project ownership, set projects.ownership: managed.

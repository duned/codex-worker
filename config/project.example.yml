project:
  name: Example Project
  repository: owner/repository
  directory: /home/worker/projects/repository

# Optional dotenv file. Relative paths resolve from this project YAML file.
# For a Finance project, this could be:
# environment:
#   file: /home/worker/.config/finance/test.env

git:
  baseBranch: main
  featurePrefix: feature/
  completedPrefix: done/feature/
  autoMerge: true
  pushCompletedBranch: true
  deleteLocalFeatureBranch: true

github:
  readyLabel: codex-ready
  workingLabel: codex-working
  blockedLabel: codex-blocked
  failedLabel: codex-failed
  doneLabel: codex-done

# Maximum Issues this project may execute at once. Defaults to 1; the global
# worker.maxParallelTasks limit still caps the entire worker process.
worker:
  maxParallelTasks: 1
  # Retries start clean by default. Set to "resume" only when failed work should be reused;
  # resume stops safely if the prior execution's persisted workspace cannot be verified.
  retryMode: restart

codex:
  instructionsFile: AGENTS.md
  model: gpt-6-luna
  reasoningEffort: high
  timeoutMinutes: 90

validation:
  timeoutSeconds: 900
  maxFixAttempts: 2
  commands:
    - dotnet test

# Protect environment files with restrictive permissions, for example: chmod 600 /path/to/test.env

# gitTimeoutSeconds and githubTimeoutSeconds default to 120 and 60.

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Worker</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#19222d;--line:#2b3948;--muted:#a9bacb;--text:#edf4fb;--blue:#69b7ff;--green:#6fdaa0;--red:#ff8585;--amber:#f4c76a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}header{padding:22px max(24px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0}main{max-width:1240px;margin:24px auto;padding:0 24px}.top{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.label,.muted{color:var(--muted);font-size:13px}.value{font-size:22px;font-weight:650;margin-top:5px}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}section{margin-top:16px;overflow:auto}section h2{font-size:17px;margin:0 0 14px}button{background:#245d8d;color:white;border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button.secondary{background:#344252}button.danger{background:#85414a}button:focus,input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}.actions{display:flex;gap:7px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:550;font-size:13px}.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px}.badge.good{color:var(--green)}.badge.bad{color:var(--red)}.badge.warn{color:var(--amber)}.empty{color:var(--muted);padding:12px 0}.event{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.event time{color:var(--muted);margin-right:8px}dialog{width:min(720px,calc(100% - 28px));max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:22px}dialog::backdrop{background:#000a}dialog h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:13px;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:6px;background:#101720;color:var(--text);padding:9px;font:inherit}.errors{white-space:pre-wrap;color:var(--red);margin:10px 0}.right{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.connection{font-size:13px;color:var(--green)}.connection.off{color:var(--amber)}@media(max-width:850px){.top{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}main{padding:0 12px}header{padding:18px 14px}}
</style>
</head>
<body>
<header><h1>Codex Worker <span id="version" class="muted"></span></h1><div class="actions"><span id="connection" class="connection">Connecting…</span><button id="refresh" class="secondary">Refresh</button><button id="workerDrain" class="danger">Drain worker</button></div></header>
<main>
<div class="top" id="overview"></div>
<section><div class="actions" style="justify-content:space-between"><h2>Projects</h2><button id="create">Add project</button></div><div id="projects"></div></section>
<section><h2>Executions</h2><div id="executions"></div></section>
<div class="cols"><section style="margin-top:0"><h2>Runtime events <span id="eventState" class="muted">Connecting…</span></h2><div id="events" class="muted"></div></section><section style="margin-top:0"><h2>Worker capacity</h2><div id="capacity" class="muted"></div></section></div>
</main>
<dialog id="editor"><form id="projectForm"><h2 id="formTitle">Project</h2><div id="errors" class="errors" role="alert"></div><div class="formgrid">
<div class="field"><label for="name">Project name</label><input id="name" required></div><div class="field"><label for="repository">GitHub repository (owner/name)</label><input id="repository" required></div>
<div class="field wide"><label for="directory">Checkout directory</label><input id="directory" required></div><div class="field"><label for="environmentFile">Environment file path (reference only)</label><input id="environmentFile"></div><div class="field"><label for="instructions">Codex instructions file</label><input id="instructions" required></div>
<div class="field"><label for="maxParallel">Project capacity (1–8)</label><input id="maxParallel" type="number" min="1" max="8" required></div><div class="field"><label for="reasoning">Reasoning effort</label><select id="reasoning"><option>low</option><option>medium</option><option>high</option><option>xhigh</option></select></div>
<div class="field"><label for="retryMode">Retry behavior</label><select id="retryMode"><option value="restart">Restart from current base</option><option value="resume">Resume verified previous work</option></select></div><div class="field"></div>
<div class="field"><label for="timeout">Codex timeout (minutes)</label><input id="timeout" type="number" min="1" required></div><div class="field"><label for="repairAttempts">Validation repair attempts (0–5)</label><input id="repairAttempts" type="number" min="0" max="5" required></div>
<div class="field"><label for="baseBranch">Git base branch</label><input id="baseBranch" required></div><div class="field"><label for="featurePrefix">Feature branch prefix</label><input id="featurePrefix" required></div><div class="field"><label for="completedPrefix">Completed branch prefix</label><input id="completedPrefix" required></div>
<div class="field"><label for="readyLabel">Ready label</label><input id="readyLabel" required></div><div class="field"><label for="workingLabel">Working label</label><input id="workingLabel" required></div><div class="field"><label for="blockedLabel">Blocked label</label><input id="blockedLabel" required></div><div class="field"><label for="failedLabel">Failed label</label><input id="failedLabel" required></div><div class="field"><label for="integrationConflictLabel">Integration conflict label</label><input id="integrationConflictLabel" required></div><div class="field"><label for="integrationRecoveryLabel">Integration recovery request label</label><input id="integrationRecoveryLabel" required></div><div class="field"><label for="doneLabel">Done label</label><input id="doneLabel" required></div>
</div><div class="muted" style="margin-top:12px">Validation commands and environment values are never shown here. Existing validation commands are retained when editing.</div><div class="right"><button type="button" id="cancel" class="secondary">Cancel</button><button type="submit">Save project</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id), statusEndpoint='/api/status', api=async(path,options={})=>{const url=path.startsWith('/api/')?path:'/api'+path;const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){let m=`Request failed (${r.status})`;try{const x=await r.json();m=x.error||m}catch{}throw Error(m)}return r.status===204?null:r.json()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');const duration=ms=>{if(ms==null)return '—';let s=Math.floor(ms/1000);return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`};const badge=s=>`<span class="badge ${/enabled|running|completed|succeeded/i.test(s)?'good':/failed|blocked|infrastructure/i.test(s)?'bad':'warn'}">${esc(s)}</span>`;
async function refresh(){try{const [s,p,x,e,d]=await Promise.all([api(statusEndpoint),api('/projects'),api('/executions?limit=30'),api('/events?limit=30'),api('/worker/drain')]);$('connection').textContent='API connected';$('connection').className='connection';$('version').textContent=`v${s.version}`;$('overview').innerHTML=[['Worker state',badge(s.state)],['Uptime',duration(s.uptimeSeconds*1000)],['Execution capacity',`${s.activeExecutionCount} active / ${s.maxParallelTasks} maximum`],['Projects',`${s.enabledProjectCount} enabled / ${s.configuredProjectCount} configured`],['Worker drain',d.draining?'Draining':'Accepting work']].map(([a,b])=>`<div class="card"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');$('capacity').innerHTML=`Global available capacity: <strong>${s.availableExecutionCapacity}</strong><br>Active executions: <strong>${s.activeExecutionCount}</strong><br>Worker drain complete: <strong>${d.drainComplete?'Yes':'No'}</strong>`;
 if(s.managedDiagnostics){const m=s.managedDiagnostics;$('capacity').innerHTML+=`<h3>Managed configuration</h3><div>Retrieval: ${esc(m.retrieval)} · Synchronization: ${esc(m.synchronization)} · Source: ${esc(m.source)}</div><div>Desired: ${esc(m.desiredVersion||'unknown')} · Applied: ${esc(m.appliedVersion||'unknown')}</div>${m.diagnosticCode?`<div>${esc(m.failureStage)}: ${esc(m.diagnosticCode)} · ${esc(m.failedProjectId||'unknown project')} · revision ${esc(m.failedProjectRevision??'unknown')}</div>`:''}${m.projects.map(q=>`<div>${esc(q.projectId)} · revision ${esc(q.revision)} · ${esc(q.state)}${q.diagnosticCode?' · '+esc(q.diagnosticCode):''}</div>`).join('')}`;}
 $('projects').innerHTML=p.length?`<table><thead><tr><th>Project</th><th>Repository</th><th>State</th><th>Capacity</th><th>Queued</th><th>Actions</th></tr></thead><tbody>${p.map(q=>`<tr><td>${esc(q.name)}</td><td>${esc(q.repository)}</td><td>${badge(q.state)}${q.unavailableReason?`<br><span class="muted">${esc(q.unavailableReason)}</span>`:''}</td><td>${q.activeExecutionCount} / ${q.maxParallelTasks}</td><td>${q.readyWorkCount??'—'}</td><td><div class="actions"><button class="secondary" onclick="editProject('${enc(q.name)}')">Edit</button><button class="secondary" onclick="life('${enc(q.name)}','${q.enabled?'disable':'enable'}')">${q.enabled?'Disable':'Enable'}</button><button class="secondary" onclick="life('${enc(q.name)}','drain')">Drain</button><button class="danger" onclick="removeProject('${enc(q.name)}')">Remove</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No projects configured.</div>';
 $('executions').innerHTML=x.length?`<table><thead><tr><th>Project / Issue</th><th>Attempt</th><th>Codex</th><th>State / result</th><th>Started</th><th>Duration</th><th>Validation / repairs</th><th>Recovery</th></tr></thead><tbody>${x.map(a=>`<tr><td>${esc(a.project)}<br><span class="muted">#${a.issueNumber} ${esc(a.issueTitle)}</span></td><td>${a.attemptNumber}${a.retryOfExecutionId?`<br><span class="muted">${a.resumed?'Resumed':'Restarted'} from ${esc(a.retryOfExecutionId)}</span>`:''}</td><td>${a.effectiveEffort?`${esc(a.effectiveModel||"unknown (CLI model unavailable)")}<br><span class="muted">${esc(a.effectiveEffort)}</span>`:"—"}</td><td>${badge(a.state)}<br><span class="muted">${esc(a.result||'In progress')}</span>${a.failureReason?`<br><span class="muted">Primary: ${esc(a.failureReason)}</span>`:''}${a.reportingFailure?`<br><span class="muted">GitHub reporting: ${esc(a.reportingFailure)}</span>`:''}</td><td>${new Date(a.startedAtUtc).toLocaleString()}</td><td>${duration(a.durationMilliseconds??(a.completedAtUtc?Date.parse(a.completedAtUtc)-Date.parse(a.startedAtUtc):Date.now()-Date.parse(a.startedAtUtc)))}</td><td>${esc(a.validationOutcome||'—')} · ${a.repairCount} repairs</td><td>${a.recoveryState?`${badge(a.recoveryState)}<br><span class="muted">${esc(a.recoveryStatus||'')}</span>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No execution history yet.</div>';
 renderEvents(e)}catch(err){$('connection').textContent=`API unavailable: ${err.message}`;$('connection').className='connection off'}}
function renderEvents(e){$('events').innerHTML=e.length?e.slice().reverse().map(v=>`<div class="event"><time>${new Date(v.timestampUtc).toLocaleTimeString()}</time>${badge(v.type)} ${esc(v.project?`${v.project}: `:'')}${esc(v.message)}</div>`).join(''):'No recent events.'}
async function life(name,action){try{await api(`/projects/${name}/lifecycle`,{method:'POST',body:JSON.stringify({action})});refresh()}catch(e){alert(e.message)}}async function removeProject(name){if(!confirm(`Remove project “${decodeURIComponent(name)}”? This permanently deletes its configuration.`))return;try{await api(`/project-configurations/${name}`,{method:'DELETE'});refresh()}catch(e){alert(e.message)}}
const fields=['name','repository','directory','environmentFile','instructions','maxParallel','retryMode','reasoning','timeout','repairAttempts','baseBranch','featurePrefix','completedPrefix','readyLabel','workingLabel','blockedLabel','failedLabel','integrationConflictLabel','integrationRecoveryLabel','doneLabel'];let original=null,editingName=null;
function val(id,v){$(id).value=v??''}function openEditor(c,isNew){original=c;editingName=isNew?null:c.project.name;$('formTitle').textContent=isNew?'Add project':'Edit project';$('errors').textContent='';let p=c.project||{},g=c.git||{},h=c.github||{},co=c.codex||{},v=c.validation||{},w=c.worker||{};val('name',p.name);val('repository',p.repository);val('directory',p.directory);val('environmentFile',c.environmentFile);val('instructions',co.instructionsFile);val('maxParallel',w.maxParallelTasks||1);val('retryMode',w.retryMode||'restart');val('reasoning',co.reasoningEffort||'medium');val('timeout',co.timeoutMinutes||60);val('repairAttempts',v.maxFixAttempts??2);val('baseBranch',g.baseBranch||'main');val('featurePrefix',g.featurePrefix||'feature/');val('completedPrefix',g.completedPrefix||'completed/');for(const n of ['ready','working','blocked','failed','integrationConflict','integrationRecovery','done'])val(n+'Label',h[n+'Label']);$('editor').showModal()}
function blank(){return {project:{},git:{baseBranch:'main',featurePrefix:'feature/',completedPrefix:'completed/',autoMerge:true,pushCompletedBranch:true,deleteLocalFeatureBranch:true},github:{},codex:{instructionsFile:'AGENTS.md',reasoningEffort:'medium',timeoutMinutes:60},validation:{commands:[],timeoutSeconds:900,maxFixAttempts:2},environment:{file:null},worker:{gitTimeoutSeconds:120,githubTimeoutSeconds:60,maxParallelTasks:1,retryMode:'restart'}}}
async function editProject(n){try{const v=await api(`/project-configurations/${n}`),c=blank();c.project={name:v.name,repository:v.repository,directory:v.directory};c.git=v.git;c.github=v.github;c.codex=v.codex;c.validation=v.validation;c.environment.file=v.environmentFile;c.worker=v.worker;openEditor(c,false)}catch(e){alert(e.message)}}$('create').onclick=()=>openEditor(blank(),true);$('cancel').onclick=()=> $('editor').close();$('refresh').onclick=refresh;
$('workerDrain').onclick=async()=>{if(!confirm('Drain the worker? It will stop accepting new work and let active executions finish.'))return;try{await api('/worker/drain',{method:'POST',body:'{}'});refresh()}catch(e){alert(e.message)}};
 $('projectForm').onsubmit=async ev=>{ev.preventDefault();const c=original;c.project={...c.project,name:$('name').value.trim(),repository:$('repository').value.trim(),directory:$('directory').value.trim()};c.environment={...c.environment,file:$('environmentFile').value.trim()||null};c.codex={...c.codex,instructionsFile:$('instructions').value.trim(),reasoningEffort:$('reasoning').value,timeoutMinutes:+$('timeout').value};c.worker={...c.worker,maxParallelTasks:+$('maxParallel').value,retryMode:$('retryMode').value};c.validation={...c.validation,maxFixAttempts:+$('repairAttempts').value};c.git={...c.git,baseBranch:$('baseBranch').value.trim(),featurePrefix:$('featurePrefix').value.trim(),completedPrefix:$('completedPrefix').value.trim()};c.github={...c.github};for(const n of ['ready','working','blocked','failed','integrationConflict','integrationRecovery','done'])c.github[n+'Label']=$(`${n}Label`).value.trim();try{await api(editingName?`/project-configurations/${encodeURIComponent(editingName)}`:'/project-configurations',{method:editingName?'PUT':'POST',body:JSON.stringify(c)});$('editor').close();refresh()}catch(e){$('errors').textContent=e.message}};
let source;function connectEvents(){source?.close();source=new EventSource('/api/events/stream');source.onopen=()=>{$('eventState').textContent='Live';$('eventState').className='connection'};source.onerror=()=>{$('eventState').textContent='Disconnected · reconnecting';$('eventState').className='connection off'};const update=async()=>{try{const recent=await api('/events?limit=30');renderEvents(recent);await refresh()}catch{}};for(const type of ['worker.starting','worker.started','worker.stopped','worker.failed','worker.drain.started','worker.drain.completed','execution.started','execution.finished','project.enabled','project.disabled','project.drain.started','project.drain.completed','project.github-failure','project.github-reconciliation-required','configuration.reloaded','configuration.reload.rejected'])source.addEventListener(type,update);api('/events?limit=30').then(renderEvents).catch(()=>{})}
refresh();connectEvents();setInterval(refresh,10000);
</script>
</body></html>

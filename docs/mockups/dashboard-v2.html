    return [id === 'nuevo' ? 'Añadir proyecto' : 'Editar proyecto', field('p-name', 'Nombre', p.name) + field('p-repo', 'Repositorio de GitHub', p.repo, 'Con el formato propietario/repositorio.') + field('p-base', 'Rama base', p.base, 'Donde se integra cada issue terminada.') + field('p-par', 'Issues en paralelo', p.parallel, 'Cuántas issues de este proyecto pueden implementarse a la vez.', 'number') + field('p-val', 'Comando de validación', p.validation, 'Se ejecuta antes de integrar. Si falla, la issue no se integra.') + `<label for="p-eng">Motor<select id="p-eng"><option>Codex</option><option>Claude Code</option></select></label><label class="check"><input type="checkbox" id="p-auto" ${p.auto ? 'checked' : ''}><span>Recoger automáticamente las issues con la etiqueta <span class="mono">codex-ready</span></span></label>`, id === 'nuevo' ? 'Proyecto añadido' : 'Proyecto guardado']; },
  worker(id) { const w = W(id);
    return w ? ['Editar Worker', field('w-name', 'Nombre', w.name) + field('w-slots', 'Huecos de trabajo', w.slots, 'Cuántas issues puede implementar a la vez esta máquina.', 'number') + `<label for="w-eng">Motor por defecto<select id="w-eng"><option>Codex</option><option>Claude Code</option></select></label><label class="check"><input type="checkbox" id="w-pause" ${w.paused ? 'checked' : ''}><span>Pausar: termina lo que tiene y no recoge más</span></label><label class="check"><input type="checkbox" id="w-upd" checked><span>Actualizar automáticamente a la versión del servidor</span></label><div class="row">${act('Reiniciar servicio')}${act('Desconectar Worker', 'danger')}</div>`, 'Worker guardado']
      : ['Conectar un Worker', `<p class="sub" style="margin:0">Ejecuta este comando en la máquina nueva. El código caduca en 15 minutos.</p><pre style="margin:0">codex-worker register \\\n  --server https://codex.ejemplo.dev \\\n  --code 7K2M-QX4P</pre>` + field('w-newname', 'Nombre', '', 'Opcional. Por defecto se usa el nombre de la máquina.') + field('w-newslots', 'Huecos de trabajo', 2, '', 'number'), 'Esperando a que el Worker se conecte']; },
  issue(rest) {
    if (rest.startsWith('editar-')) { const i = I(+rest.slice(7));
      return [`Ajustes de la issue #${i.n}`, `<p class="sub" style="margin:0">Se aplican al siguiente intento.</p><label for="ie-eng">Motor<select id="ie-eng"><option>El del proyecto (${P(i.p).engine})</option><option>Codex</option><option>Claude Code</option></select></label><label for="ie-eff">Esfuerzo<select id="ie-eff"><option>Medio</option><option>Bajo</option><option>Alto</option></select></label><label for="ie-retry">Al reintentar<select id="ie-retry"><option>Empezar desde cero</option><option>Continuar el trabajo guardado</option></select></label>`, 'Ajustes guardados']; }
    const p = P(rest.replace('nueva-', ''));
    return ['Añadir issue a la cola', `<p class="sub" style="margin:0">Proyecto ${p.name} · ${p.repo}</p>` + field('i-num', 'Número de issue', '', 'La issue debe existir y estar abierta en GitHub.', 'number') + `<label for="i-eng">Motor<select id="i-eng"><option>El del proyecto (${p.engine})</option><option>Codex</option><option>Claude Code</option></select></label><label for="i-eff">Esfuerzo<select id="i-eff"><option>Medio</option><option>Bajo</option><option>Alto</option></select></label>`, 'Issue añadida a la cola']; },
  credencial(id) { const name = { github: 'GitHub', codex: 'Codex', telegram: 'Telegram' }[id];
    return [name ? `Editar credencial de ${name}` : 'Añadir credencial', (name ? '' : `<label for="c-kind">Servicio<select id="c-kind"><option>GitHub</option><option>Telegram</option></select></label>`) + field('c-val', 'Nuevo valor', '', 'El valor actual nunca se muestra. Déjalo vacío para conservarlo.') + `<label for="c-who">Workers que pueden usarla<select id="c-who"><option>Todos los gestionados</option><option>Solo VM1</option><option>Solo VM2</option></select></label>`, 'Credencial guardada']; },
};

// ---- Navegación ----
const state = { tab: 'trabajo' };
const NAV = [['inicio', 'Inicio'], ['proyectos', 'Proyectos'], ['workers', 'Workers'], ['ajustes', 'Ajustes']];
const SECTION = { proyecto: 'proyectos', issue: 'proyectos', ejecucion: 'proyectos', worker: 'workers' };
function route() {
  const hash = location.hash.slice(1) || 'inicio', [name, ...rest] = hash.split('-'), arg = rest.join('-');
  const view = views[name] ? name : 'inicio';
  let html; try { html = views[view](arg); } catch { html = views.inicio(); }
  document.getElementById('main').innerHTML = `<div class="page">${html}</div>`;
  const current = SECTION[view] ?? view;
  document.getElementById('nav').innerHTML = NAV.map(([id, label]) => `<a href="#${id}" ${id === current ? 'aria-current="page"' : ''}>${label}${id === 'inicio' ? `<span class="count num">${attention.length}</span>` : ''}</a>`).join('');
}
function openPanel(key) {
  const [kind, ...rest] = key.split('-'), [title, body, done] = panels[kind](rest.join('-'));
  document.getElementById('overlay').innerHTML = `<div class="shade" data-close></div><aside class="panel" role="dialog" aria-modal="true" aria-label="${title}"><header><h2>${title}</h2><button class="btn sm" data-close aria-label="Cerrar">Cerrar</button></header><form id="panel-form">${body}</form><footer><button class="btn" data-close>Cancelar</button><button class="btn primary" data-close data-toast="${done}">Guardar</button></footer></aside>`;
  document.querySelector('.panel input, .panel select')?.focus();
}
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = Object.assign(document.createElement('div'), { className: 'toast', textContent: text });
  el.setAttribute('role', 'status'); document.body.append(el); setTimeout(() => el.remove(), 2400);
}
document.addEventListener('click', event => {
  const el = event.target.closest('[data-panel],[data-close],[data-toast],[data-tab]'); if (!el) return;
  if (el.dataset.tab) { state.tab = el.dataset.tab; route(); return; }
  if (el.tagName === 'BUTTON') event.preventDefault();
  if (el.dataset.panel) return openPanel(el.dataset.panel);
  if (el.hasAttribute('data-close')) document.getElementById('overlay').innerHTML = '';
  if (el.dataset.toast) toast(el.dataset.toast);
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') document.getElementById('overlay').innerHTML = ''; });
document.addEventListener('submit', event => event.preventDefault());
function applyFilter(bar) {
  const list = document.getElementById(bar.dataset.filter), q = bar.querySelector('input').value.trim().toLowerCase(), s = bar.querySelector('select').value;
  let shown = 0;
  for (const row of list.querySelectorAll('[data-s]')) { const ok = (!q || row.textContent.toLowerCase().includes(q)) && (!s || row.dataset.s.split(' ').includes(s)); row.hidden = !ok; shown += ok; }
  list.querySelector('.none')?.remove();
  if (!shown) list.insertAdjacentHTML('beforeend', '<div class="m none">Nada coincide con el filtro.</div>');
}
for (const type of ['input', 'change']) document.addEventListener(type, event => { const bar = event.target.closest('.filters'); if (bar) applyFilter(bar); });
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
addEventListener('hashchange', () => { state.tab = 'trabajo'; document.getElementById('overlay').innerHTML = ''; scrollTo(0, 0); route(); });
route();
</script>

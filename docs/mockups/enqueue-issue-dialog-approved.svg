<svg xmlns="http://www.w3.org/2000/svg" width="1596" height="500" viewBox="0 0 1596 500" role="img" aria-labelledby="title desc">
  <title id="title">Approved dark Enqueue Issue dialog visual reference</title>
  <desc id="desc">Full-width black rounded dialog with thin grey outline. Left-aligned title, project name and description; top-right close icon; bottom-right text Cancel and subdued purple Enqueue Issue button. No language selector.</desc>
  <rect width="1596" height="500" fill="#000000"/>
  <rect x="28" y="24" width="1534" height="450" rx="23" fill="#000000" stroke="#303030" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" fill="#F5F5F5">
    <text x="61" y="98" font-size="36" font-weight="700">Enqueue Issue #22</text>
    <text x="61" y="175" font-size="31" font-weight="700">Codex Worker Test</text>
    <text x="61" y="251" font-size="30" font-weight="400">Request a new execution for this Issue. The Server will check whether it</text>
    <text x="61" y="302" font-size="30" font-weight="400">can run and whether a Worker is available.</text>
  </g>
  <g stroke="#D3D3D3" stroke-width="2.6" stroke-linecap="round">
    <path d="M1506 76 L1522 92 M1522 76 L1506 92"/>
  </g>
  <text x="1120" y="404" fill="#EAEAEA" font-family="Inter, Arial, sans-serif" font-size="30">Cancel</text>
  <rect x="1288" y="341" width="241" height="100" rx="18" fill="#1C142A"/>
  <text x="1408" y="403" text-anchor="middle" fill="#EDE9F2" font-family="Inter, Arial, sans-serif" font-size="30">Enqueue Issue</text>
</svg>
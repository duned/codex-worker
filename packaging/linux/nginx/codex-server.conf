# Include once in nginx's http context (Ubuntu: sites-enabled).
# Replace codex-server.example.com and the VPN source subnet before deployment.
geo $codex_admin_network {
    default 0;
    10.77.0.0/24 1;
}

# Public routes are method-specific. Everything else requires the VPN.
map "$request_method:$uri" $codex_public_route {
    default 0;
    "POST:/api/v1/workers/register" 1;
    ~^PUT:/api/v1/workers/[^/]+$ 1;
    ~^POST:/api/v1/workers/[^/]+/heartbeat$ 1;
    ~^GET:/api/v1/workers/[^/]+/configuration$ 1;
    ~^POST:/api/v1/workers/[^/]+/assignments/request$ 1;
    ~^POST:/api/v1/workers/[^/]+/provisioning/request$ 1;
    ~^POST:/api/v1/workers/[^/]+/provisioning/[^/]+/report$ 1;
    ~^POST:/api/v1/workers/[^/]+/provisioning/commands/request$ 1;
    ~^POST:/api/v1/workers/[^/]+/provisioning/commands/[^/]+/report$ 1;
    ~^POST:/api/v1/workers/[^/]+/executions/[^/]+/report$ 1;
    ~^POST:/api/v1/workers/[^/]+/executions/[^/]+/lease/renew$ 1;
    ~^GET:/api/v1/workers/[^/]+/credentials/[^/]+$ 1;
}
map "$codex_public_route:$codex_admin_network" $codex_deny {
    default 0;
    "0:0" 1;
}
map $uri $codex_enrollment_key {
    default "";
    /api/v1/workers/register $binary_remote_addr;
}
limit_req_zone $codex_enrollment_key zone=codex_enrollment:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=codex_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=codex_connections:10m;

# No endpoint on HTTP except ACME HTTP-01; never redirect authenticated traffic.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name codex-server.example.com;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    # A valid SNI followed by an unknown HTTP Host can select this server.
    return 421;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex-server.example.com;
    ssl_certificate /etc/letsencrypt/live/codex-server.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex-server.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    # Standard nginx error messages can contain URLs. Do not retain request logs.
    error_log /dev/null crit;
    if ($host != codex-server.example.com) { return 421; }
    if ($ssl_server_name != codex-server.example.com) { return 421; }
    if ($codex_deny) { return 403; }

    client_max_body_size 4m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn codex_connections 100;
    limit_conn_status 429;
    limit_req zone=codex_enrollment burst=5 nodelay;
    limit_req zone=codex_requests burst=100 nodelay;
    limit_req_status 429;

    # Applies to errors produced by nginx as well as backend responses.
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host codex-server.example.com;
        # No forwarded-header middleware or real_ip configuration in this recipe.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_store off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
    }
}

# Temporary http-context configuration, before the first certificate exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name codex-server.example.com;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}

# Pull request and base-branch validation. It runs the same repository-owned command
# the Worker runs before integrating (tools/validate.py), forced to the full suite, plus
# the dashboard's model tests. Projects in pull-request integration mode can require
# this check before GitHub merges a Worker's pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git identity for repository tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Restore
        run: dotnet restore CodexWorker.sln
      - name: Validate (build, analyzers and full test suite)
        run: python3 tools/validate.py --base origin/main --full
      - name: Dashboard model tests
        working-directory: src/CodexServer/dashboard
        run: npm test
